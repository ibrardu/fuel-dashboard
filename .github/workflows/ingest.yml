name: Daily data ingestion

on:
  schedule:
    # 01:30 UTC ≈ 07:00 IST — after OMCs' ~6am price revision and PPAC's
    # same-morning PDF republish. Adjust if real publish-time patterns
    # observed over the first few runs suggest an earlier/later slot.
    - cron: "30 1 * * *"
  workflow_dispatch: {}

jobs:
  ingest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - run: npm ci

      - run: npm run db:ingest
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
